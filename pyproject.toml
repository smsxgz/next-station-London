[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-station-london"
version = "0.1.0"
description = "A small Next Station: London game engine, solver, and browser app"
requires-python = ">=3.11"

[project.scripts]
next-station-mcts = "experiments.mcts:main"
next-station-mcts-reuse = "experiments.mcts_reuse:main"
next-station-dqn-mcts = "experiments.dqn_mcts:main"
next-station-compare = "experiments.compare:main"
next-station-benchmark = "experiments.benchmark:main"
next-station-rl = "solver.RL.cli:main"
next-station-afterstate = "rl.afterstate.cli:main"

[project.optional-dependencies]
rl = [
    "numpy>=1.26",
    "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["engine_cpp", "engine_cpp.*", "solver", "solver.*", "experiments", "rl", "rl.*"]
